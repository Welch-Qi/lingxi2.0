# ============================================================================
# 灵犀系统权限模型（技术规约2.0 §4.9.2）
#
# 三层权限统一由本模型承载，业务模块经 SDK 调用，禁止各模块私有 ACL 表：
#   ① 功能权限：role + 权限码 {域}:{对象}:{动作}
#   ② 行级权限：dataScope（SELF/DEPT/DEPT_AND_SUB/CUSTOM/ALL）+ 资源维度
#   ③ 字段权限：字段级可见/可编辑（成本价、利润率默认隐藏）
#
# 策略变更后由配置中心发布事件，各实例热重载（撤权即时生效，无需重启）。
# ============================================================================

[request_definition]
r = sub, obj, act, scope

[policy_definition]
p = sub, obj, act, scope

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# keyMatch2 支持 :id 风格路径；regexMatch 支持动作通配；scope 为空视为不限制数据范围
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act) && (p.scope == "" || p.scope == r.scope)
