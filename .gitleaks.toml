# ============================================================================
# 灵犀系统 —— gitleaks 配置
#
# 目的：消除本仓一类固有代码模式造成的**误报**，同时**不削弱任何真实密钥检测**。
#
# 背景（2026-10-26 CI 首跑实测）：默认规则集下 generic-api-key 命中 35 处，
# 全部是前端 i18n 键名赋值，形如：
#     productKey: 'rec.lead.RC-2201.product'
#     waitingKey: 'rec.lead.RC-2201.waiting'
#     textKey:    'rec.lead.RC-2201.m1'
# 这些值是**语言包键名**（公开、可枚举、非机密），但其形态
# 「变量名含 Key + 后跟一个较长的点分字符串」与 generic-api-key 的正则完全吻合。
#
# ── 处置原则（重要）────────────────────────────────────────────────────
#   **只加 allowlist（内容级排除），绝不覆写或删除任何检测规则。**
#   覆写 generic-api-key 的 regex 会连带削弱它对真实 api key 的检出能力
#   （如 SWEET_* 之类的高熵串），属「为了让 CI 变绿而降低安全基线」——
#   本仓明令禁止（规约 §4.9.6 门禁阈值：0 高危）。
#   allowlist 只针对「键名以 Key/Text/Title/Label 等结尾 + 值为语言包键名」
#   这一种确定无害的形态，不影响其他任何匹配。
#
# 生效方式：CI 的 security:secrets job 传 --config .gitleaks.toml
# ============================================================================

[extend]
# 继承 gitleaks 默认规则集（不自己重写规则表 —— 自己维护规则必然漏项）
useDefault = true

# ---------------------------------------------------------------------------
# allowlist：排除 i18n 键名赋值形态
#
# 匹配条件（三者同时满足才排除）：
#   ① 变量名以 i18n 键名惯用后缀结尾（Key / Text / Title / Label / Placeholder …）
#   ② 赋值为单引号或双引号包裹的字符串
#   ③ 该字符串形如语言包键名（点分层级 + 允许短横线/数字）
#
# 用 (?i) 大小写不敏感 + 精确的后缀词表，避免误伤真实密钥变量名
# （如 apiKey / secretToken / authSecret —— 这些后缀不在词表内）。
# ---------------------------------------------------------------------------
[[allowlists]]
description = "前端 i18n 语言包键名赋值（如 productKey: 'rec.lead.RC-2201.product'）—— 公开可枚举，非密钥"
regex = '''(?i)\b[a-z][a-zA-Z0-9]*(?:Key|Text|Title|Label|Placeholder|Description|Icon)\s*[:=]\s*['"][A-Za-z0-9]+(?:[.\-][A-Za-z0-9]+)+['"]'''
paths = [
  '''lingxi-web/.*''',
  '''lingxi-ops/.*''',
  '''lingxi-server/.*''',
]

# ---------------------------------------------------------------------------
# allowlist：配置模板与示例文件（含占位口令，非真实密钥）
# 形如 LX_DB_PASSWORD=lingxi（示例值）不应被判为密钥泄露。
# 只排除 .env.example / *.example / config 模板目录 —— 真实 .env 仍被扫。
# ---------------------------------------------------------------------------
[[allowlists]]
description = "示例与模板文件（.env.example 等）中的占位口令"
paths = [
  '''.*\.env\.example$''',
  '''.*\.example$''',
  '''lingxi-ops/config/.*''',
  '''lingxi-ops/.env$''',
]
