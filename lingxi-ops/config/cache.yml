################
# 缓存 / 会话 / 锁 / 限流 / 事件流配置（Valkey 9，BSD-3-Clause）
#
# 同样只连本地映射端口 127.0.0.1:16379（技术规约2.0 §3.1 E2）
# 禁止把需要持久化的业务数据只放在缓存里（§4.4.4）
################
spring:
  data:
    redis:
      host: 127.0.0.1
      port: ${LX_CACHE_TUNNEL_PORT:16379}
      password: ${LX_CACHE_PASSWORD}
      database: ${LX_CACHE_DB:0}
      timeout: 3000ms
      connect-timeout: 3000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 32
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
        shutdown-timeout: 200ms

yuanshu:
  cache:
    # 缓存键统一格式 lx:{域}:{业务}:{tenantId}:{标识}（§4.4.4 附录C）
    key-prefix: lx
    default-ttl-seconds: 86400      # 默认 <=24h
    # 防穿透 / 击穿 / 雪崩三重防护（§4.8）
    null-value-ttl-seconds: 60
    lock-wait-seconds: 3
    lock-lease-seconds: 30
    ttl-jitter-percent: 10

  event:
    # 领域事件经 Outbox -> Valkey Stream（§4.7.1）
    stream-prefix: lx.stream
    consumer-group: lingxi-server
    dead-letter-prefix: lx.dlq
    max-retry: 16
    outbox:
      # 定时轮询 + ShedLock 单实例投递（§4.5.5）
      poll-interval-ms: 1000
      batch-size: 200
      lock-name: lx-outbox-publisher

  ratelimit:
    # 租户级 + 接口级限流，响应头回传 X-RateLimit-*（§4.3.3）
    enabled: true
    tenant-default-qps: 100
    interface-default-qps: 50

  idempotency:
    # 写操作幂等键 X-Idempotency-Key，有效期 24 小时（§4.3.3）
    header-name: X-Idempotency-Key
    expire-hours: 24
