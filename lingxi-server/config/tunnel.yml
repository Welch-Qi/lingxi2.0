################
# SSH 隧道参数（云端地址唯一出现处）
#
# 架构约束（技术规约2.0 §3.1 E2/E3/E4）：
#   - 开发环境隧道仅 2 条：PostgreSQL + Valkey；新增隧道需架构组审批
#   - 隧道建立 / 监测 / 重连只由 scripts/tunnel-up.sh 与 check-tunnel.sh 负责
#   - 应用代码禁止出现任何 ssh / jsch / paramiko 客户端
################
lingxi:
  tunnel:
    host: ${LX_SSH_HOST}                 # 跳板机 / 云主机地址
    port: ${LX_SSH_PORT:22}
    user: ${LX_SSH_USER}
    identity-file: ${LX_SSH_KEY_FILE}    # 私钥路径（禁止入版本库）
    # 保活参数：30 秒心跳防防火墙掐断，3 次失败判死，转发失败即退出（防"假活"）
    server-alive-interval: 30
    server-alive-count-max: 3
    exit-on-forward-failure: true
    connect-timeout: 10
    # autossh 监控端口（0 表示使用 SSH 原生心跳替代监控端口）
    autossh-monitor-port: 0

    forwards:
      - name: postgres
        local-port: ${LX_DB_TUNNEL_PORT:13306}
        remote-host: ${LX_CLOUD_DB_HOST}
        remote-port: ${LX_CLOUD_DB_PORT:5432}
        # 只绑定本机，禁止 0.0.0.0（避免暴露云端库到局域网）
        local-bind: 127.0.0.1
        health-check:
          layer1-tcp: true
          layer2-query: SELECT 1
          layer3-command: pg_isready -h 127.0.0.1 -p ${LX_DB_TUNNEL_PORT:13306}

      - name: valkey
        local-port: ${LX_CACHE_TUNNEL_PORT:16379}
        remote-host: ${LX_CLOUD_CACHE_HOST}
        remote-port: ${LX_CLOUD_CACHE_PORT:6379}
        local-bind: 127.0.0.1
        health-check:
          layer1-tcp: true
          layer2-query: PING
          layer3-command: valkey-cli -h 127.0.0.1 -p ${LX_CACHE_TUNNEL_PORT:16379} ping

    watchdog:
      # 监测与自动重连（三层探测失败即重建）
      interval-seconds: 60
      max-rebuild-attempts: 3
      # 仍不通则通知人工并暂停当晚任务派发（§3.1 E6）
      on-failure-action: NOTIFY_AND_PAUSE_DISPATCH
      pause-flag-file: .tunnel-down
