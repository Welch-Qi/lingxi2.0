######
# 灵犀系统后端应用配置
#
# 配置外置原则（技术规约2.0 §3.5 F1/F2）：
#   本文件只放「结构 + 非敏感默认值」；
#   连接参数、缓存、模型、隧道       -> config/*.yml（入版本库，不含密钥）
#   真实口令、API Key、租户特例      -> .env（gitignore）或云 KMS / OpenBao
#   代码中禁止出现：连接串 / 口令 / API Key / 云端 IP 端口 / 模型名（F1）
######
spring:
  application:
    # 系统级容器名保留（三产品共用的单体进程）；产物名见 yuanshu-platform artifactId
    name: lingxi-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # 五个配置文件由 config/ 目录提供；缺失时不阻断启动（DevOps 侧由 env 变量兜底）
    #
    # ⚠️ 配置单一来源（2026-10-23 收敛）：
    #   此前 lingxi-server/config/ 与 lingxi-ops/config/ 各存一份完全相同的副本，
    #   改一份另一份不生效 —— 已造成多次排查耗时（模型配置缺失排查）。
    #   现以 **lingxi-ops/config/ 为唯一权威来源**（verify-skeleton.sh 校验它，
    #   且 start-dev.sh / deploy.sh 均从它部署）。
    #   LX_CONFIG_DIR 由启动脚本注入（指向 lingxi-ops/config 的绝对路径）；
    #   未注入时回退到 ./config（兼容直接从 lingxi-server 目录启动的本地调试）。
    import:
      - optional:file:${LX_CONFIG_DIR:./config}/app.yml
      - optional:file:${LX_CONFIG_DIR:./config}/db.yml
      - optional:file:${LX_CONFIG_DIR:./config}/cache.yml
      - optional:file:${LX_CONFIG_DIR:./config}/model.yml
      - optional:file:${LX_CONFIG_DIR:./config}/tunnel.yml
  threads:
    virtual:
      # I/O 密集型调用（外部 API、LLM）用虚拟线程（§4.1.5）；
      # 注意：租户/traceId 上下文必须显式传播，虚拟线程不继承 ThreadLocal
      enabled: true
  servlet:
    multipart:
      # 文件走预签名 URL 直传对象存储，应用服务器不承接大文件（§3.4 C10）
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
    # 隧道抖动场景下快速失败，避免线程耗尽（§3.1 E7）
    connection-timeout: 3s

# 统一响应体与错误码由 starter-core 提供，此处仅声明 i18n 兜底语言
yuanshu:
  tenant:
    enabled: true
    tenant-column: tenant_id
    # 免注入租户条件的表白名单（新增项须架构组评审，§3.3 D3）
    white-tables:
      - sys_dict_type
      - sys_dict_item
      - sys_i18n_message
      - sys_country
      - sys_currency
      - sys_metric_catalog
      - casbin_rule
  id:
    # 业务 ID 由平台 id 服务生成（雪花），禁止数据库自增或 UUID 作主键（§4.8.1）
    worker-id: ${LX_WORKER_ID:1}
  security:
    # Keycloak（Realm 对应租户）；issuer 等来自 config/app.yml，禁止硬编码
    oidc-enabled: true
  agent:
    # 智能体默认自主度：新增智能体/动作默认 A0（§4.6.5 默认从严）
    default-autonomy: A0
    # 连续失败达到阈值转人工（§3.6 G14）
    max-consecutive-failures: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${LX_TRACE_SAMPLING:1.0}

logging:
  level:
    root: INFO
    # 三产品包前缀：com.lingxi（灵犀集群 + Starter）/ com.yuanshu（元枢底座）
    com.lingxi: ${LX_LOG_LEVEL:INFO}
    com.yuanshu: ${LX_LOG_LEVEL:INFO}
  # 结构化 JSON 日志：必带 timestamp/level/service/traceId/tenantId/userId（§4.11.1）
  structured:
    format:
      console: ecs
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%X{traceId:-}] [%X{tenantId:-}] %logger{40} - %msg%n"
